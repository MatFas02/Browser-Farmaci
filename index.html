<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C3B32">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Indice Terapeutico">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Indice Terapeutico — collegato al database AIFA</title>
<style>
  /* Font di sistema: nessuna chiamata di rete dal renderer.
     Il download dei dati AIFA avviene solo nel processo main (main/sync.js),
     mai da questa finestra, e la CSP sopra lo blocca esplicitamente
     (connect-src 'none') come ulteriore garanzia. */
  :root{
    --font-display:'Georgia','Iowan Old Style',serif;
    --font-sans:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --font-mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --paper:#F6F3EC; --paper-2:#EFEAE0; --ink:#1C2B24; --ink-soft:#4B5A52;
    --pine:#2F5D50; --pine-deep:#1C3B32; --ochre:#A6791F; --ochre-soft:#E9DCC0;
    --line:#D8D1BF; --danger:#8C3B2E; --ok:#3B6E3B; --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);}
  .wrap{max-width:960px;margin:0 auto;padding:0 24px 80px;}

  header{padding:36px 0 20px;border-bottom:1px solid var(--line);}
  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pine);margin-bottom:10px;}
  h1{font-family:var(--font-display);font-weight:600;font-size:2.2rem;margin:0 0 6px;color:var(--pine-deep);}
  .subtitle{color:var(--ink-soft);font-size:14.5px;max-width:60ch;line-height:1.5;}

  .status-bar{
    margin-top:18px;display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:10px;
    background:#fff;border:1px solid var(--line);padding:12px 16px;
  }
  .status-left{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex-shrink:0;}
  .dot.ok{background:var(--ok);}
  .status-left b{color:var(--ink);}
  button.sync-btn{
    font-family:var(--font-mono);font-size:12px;letter-spacing:.03em;
    background:var(--pine-deep);color:#fff;border:none;padding:9px 16px;cursor:pointer;
  }
  button.sync-btn:hover{background:var(--pine);}
  button.sync-btn:disabled{opacity:.6;cursor:default;}
  button.sync-btn.secondario{background:#fff;color:var(--pine-deep);border:1.5px solid var(--pine-deep);}
  button.sync-btn.secondario:hover{background:var(--paper-2);}
  .sync-msg{font-size:12px;color:var(--pine);font-family:var(--font-mono);margin-top:8px;min-height:16px;}

  .search-box{position:sticky;top:0;background:var(--paper);padding:18px 0 14px;z-index:5;border-bottom:1px solid var(--line);}
  .search-input-row{display:flex;align-items:center;background:#fff;border:1.5px solid var(--pine-deep);padding:0 4px 0 16px;}
  #searchInput{flex:1;border:none;outline:none;background:transparent;font-family:var(--font-mono);font-size:16px;padding:13px 12px;color:var(--ink);}
  .clear-btn{background:none;border:none;cursor:pointer;font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);padding:10px 12px;}

  .results{margin-top:22px;display:flex;flex-direction:column;}

  .no-data-hint{margin-top:10px;font-size:12.5px;color:var(--danger);}

  /* --- Vista dettaglio farmaco --- */
  .back-btn{
    font-family:var(--font-mono);font-size:12px;color:var(--pine);background:none;border:none;
    cursor:pointer;padding:0;margin-bottom:18px;display:inline-flex;align-items:center;gap:6px;
  }
  .back-btn:hover{text-decoration:underline;}

  /* --- Card stile "scheda ufficiale" (ispirata al portale AIFA) ---
     Usata per: identità farmaco, info principio attivo, patologie
     collegate, varianti di prodotto, generici — stesso linguaggio
     visivo ovunque, per un aspetto ordinato e coerente. */
  .aifa-card{
    background:#F3F8FE;
    border:1px solid #D8E6F5;
    border-radius:10px;
    padding:22px 26px;
    margin-bottom:20px;
    box-shadow:0 1px 3px rgba(28,59,50,0.06);
  }
  .aifa-card-titolo{
    font-family:var(--font-sans);font-weight:700;font-size:1.4rem;
    color:#1D5FBF;margin-bottom:14px;
  }
  .aifa-card-titolo-sm{font-size:1.05rem;margin-bottom:12px;}
  .aifa-card-azienda{font-size:13.5px;color:var(--ink);margin-bottom:16px;}
  .aifa-card-azienda b{font-weight:700;}
  .aifa-link-row{display:flex;flex-wrap:wrap;gap:28px;margin-bottom:6px;}
  .aifa-link{
    display:flex;align-items:center;gap:8px;
    color:#1D5FBF;font-size:13.5px;font-weight:600;text-decoration:underline;
    background:none;border:none;cursor:pointer;padding:0;
  }
  .aifa-link:hover{color:var(--pine-deep);}
  .aifa-link svg{flex-shrink:0;}
  .aifa-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:18px 32px;
  }
  .aifa-grid-info{grid-template-columns:1fr;gap:14px;}
  .aifa-campo-titolo{font-weight:700;font-size:13.5px;color:var(--ink);margin-bottom:6px;}
  .aifa-campo-testo{font-size:13.5px;color:var(--ink);line-height:1.55;}
  .aifa-campo-lista{list-style:none;margin:0;padding:0;}
  .aifa-campo-lista li{
    font-size:13.5px;color:var(--ink);padding:3px 0 3px 14px;position:relative;
  }
  .aifa-campo-lista li::before{
    content:"";position:absolute;left:0;top:10px;width:5px;height:5px;
    border-radius:50%;background:var(--pine);
  }
  .aifa-campo-vuoto{font-size:12.5px;color:var(--ink-soft);font-style:italic;}
  .farmaco-chip-inline{
    background:none;border:none;padding:0;cursor:pointer;
    color:#1D5FBF;font-weight:600;text-decoration:underline;font-size:13.5px;
  }
  .farmaco-chip-inline:hover{color:var(--pine-deep);}
  @media (max-width:560px){ .aifa-grid{grid-template-columns:1fr;} }

  .badge-eq{
    font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;
    background:var(--pine);color:#fff;padding:1px 6px;border-radius:2px;
  }
  .composizione-mancante{color:var(--ink-soft);font-weight:400;font-style:italic;font-size:12px;}
  .badge-dosaggio{
    font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;
    background:var(--paper-2);color:var(--ink-soft);padding:1px 6px;border-radius:2px;border:1px solid var(--line);
  }

  .varianti-tabella{width:100%;border-collapse:collapse;font-size:13px;}
  .varianti-tabella th{
    text-align:left;font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;
    letter-spacing:.05em;color:var(--ink-soft);padding:0 10px 8px 0;border-bottom:1px solid #C9DCF0;
  }
  .varianti-tabella td{padding:8px 10px 8px 0;border-bottom:1px solid #E3EEF9;vertical-align:top;color:var(--ink);}
  .varianti-tabella td.mono{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}
  .varianti-tabella tr:last-child td{border-bottom:none;}

  /* --- Vista indice patologie --- */
  .indice-intro{font-size:13px;color:var(--ink-soft);margin-bottom:18px;}

  .diag-pre{
    background:#fff;border:1px solid #D8E6F5;border-radius:8px;padding:16px;
    font-family:var(--font-mono);font-size:11.5px;line-height:1.6;color:var(--ink);
    white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow:auto;
  }
  .diag-hint{font-size:13px;color:var(--ink-soft);margin-bottom:14px;}

  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty .big{font-family:var(--font-display);font-size:1.3rem;color:var(--pine-deep);margin-bottom:8px;}

  footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-soft);font-family:var(--font-mono);line-height:1.6;}

  .install-hint{font-size:11.5px;color:var(--ink-soft);margin-top:10px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Indice Terapeutico</div>
    <h1>Ricerca patologia / farmaco</h1>
    <div class="subtitle">Cerca una patologia o un farmaco.</div>

    <div class="status-bar">
      <div class="status-left">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Caricamento…</span>
      </div>
      <button class="sync-btn" id="syncBtn">Sincronizza database AIFA</button>
    </div>
    <div class="sync-msg" id="syncMsg"></div>
  </header>

  <div class="search-box">
    <div class="search-input-row">
      <input type="text" id="searchInput" placeholder="Es. asma, ibuprofene, pressione alta…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="sync-btn secondario" id="clearBtn" style="margin:6px;">Pulisci</button>
    </div>
    <div style="margin-top:10px;">
      <button class="sync-btn secondario" id="indexBtn">Indice completo patologie</button>
    </div>
  </div>

  <div id="results"></div>

  <footer>
    <div id="footerMeta">non ancora sincronizzato</div>
    <div>Fonte dati: AIFA — Agenzia Italiana del Farmaco (Open Data, licenza CC-BY 4.0).</div>
  </footer>
</div>

<script src="js/papaparse.min.js"></script>
<script src="js/sync.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
</body>
</html>
